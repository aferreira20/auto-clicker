name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with csc (.NET Framework 4.x)
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /out:AutoClicker.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll AutoClicker.cs

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker
          path: AutoClicker.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoClicker.exe
